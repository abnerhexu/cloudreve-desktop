[package]
name = "cloudreve-file-provider"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
cloudreve-api = { path = "../cloudreve-api" }
cloudreve-sync = { path = "../cloudreve-sync" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", features = ["stream"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
